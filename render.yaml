services:
  - type: web
    name: siwes-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run db:push && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
